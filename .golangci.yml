version: "2"

run:
  timeout: 120s

formatters:
  enable:
    - gofmt
    - goimports
  exclusions:
    paths:
      - generated

linters:
  default: none
  enable:
    - govet
    - revive
    - ineffassign
    - goconst
    - staticcheck   # includes gosimple and stylecheck
    - unused        # covers deadcode, varcheck, structcheck
    - bodyclose
    - dogsled
    - goprintffuncname
    - misspell
    - unconvert
    - gocritic
  settings:
    goconst:
      min-len: 4
      min-occurrences: 4
    revive:
      enable-all-rules: false
      rules:
        - name: unreachable-code
        - name: superfluous-else
  exclusions:
    paths:
      - generated
