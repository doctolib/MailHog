name: CI

on:
  push:
    branches: [master]
  pull_request:

env:
  GOLANGCI_LINT_VERSION: v2.14.0

concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GOCACHE: ${{ github.workspace }}/.cache/go-build
      GOMODCACHE: ${{ github.workspace }}/.cache/go-mod

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: mailhog
          POSTGRES_PASSWORD: mailhog
          POSTGRES_DB: mailhog
        options: >-
          --health-cmd "pg_isready -U mailhog"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Build
        run: CGO_ENABLED=0 make build

      - name: Lint
        uses: golangci/golangci-lint-action@0a35821d5c230e903fcfe077583637dea1b27b47 # v9.0.0
        with:
          version: ${{ env.GOLANGCI_LINT_VERSION }}

      - name: Test
        env:
          TEST_POSTGRESQL_URI: postgres://mailhog:mailhog@localhost:5432/mailhog
        run: make test TEST_FLAGS=-v
